# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = CaskaydiaCove Nerd Font

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 1
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    # kitty-glass fill: black at the same ~70% opacity as the
    # window_opacity rule in .config/hypr/rules.lua, matching the
    # dropdown cards in extras/sddm-theme/Main.qml
    inner_color = rgba(000000b3)

    outer_color = rgba(ffffff33)
    check_color = rgba(ffffff59)
    fail_color = rgba(ff808099)

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL$FPRINTFAIL

    # check_text = Authenticating...
    # dots_text_format = *
    dots_size = 0.2
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 70
    font_family = Iosevka

    position = 0, -130
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 16
    font_family = $font

    position = 0, -250
    halign = center
    valign = top
}

# USERNAME -- hyprlock unlocks the already-active session rather than
# switching users, so this is a display label (matching extras/sddm-theme's
# username field visually), not a selector.
label {
    monitor =
    text = cmd[update:0] whoami
    font_size = 16
    font_family = $font
    color = rgba(ffffffff)

    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 14
    onclick = hyprctl switchxkblayout all next

    position = 0, -70
    halign = center
    valign = center
}

label {
    text = cmd[update:1] ~/.config/hypr/scripts/now-playing.sh

    position = 0, -300
    halign = center
    valign = center

    font_size = 15
    color = rgba(ffffffff)
}

label {
    text = ⟨
    position = -40, -370
    halign = center
    valign = center
    font_size = 28
    onclick = playerctl previous
}

label {
    text = ⏸️
    position = 0, -370
    halign = center
    valign = center
    font_size = 28
    onclick = playerctl play-pause
}

label {
    text = ⟩
    position = 40, -370
    halign = center
    valign = center
    font_size = 28
    onclick = playerctl next
}

label {
    text = cmd[update:1] ~/.config/hypr/scripts/password-cursor.sh

    position = 0, 2
    halign = center
    valign = center

    font_size = 18
    font_family = $font
    color = rgba(ffffffff)
}
